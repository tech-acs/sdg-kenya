# --- Basic site/build settings ---
docs_baseurl: /sdg-algeria
languages:
  - en
site_dir: _build
schema_file: metadata_schema.yml
src_dir: ''

# If you have a small sanitize step, keep this hook name the same as your script.
# (Optional) Remove if you don't have scripts/alter_data.py
# data_alterations:
#   - module: scripts.alter_data
#     function: alter_data

# --- SDMX inputs: UN SDG Global Database ---
inputs:
  - class: InputSdmxMl_UnitedNationsApi
    # UN M49 (REF_AREA) code for Algeria = 012
    reference_area: 231
    # DSD from UN SDG SDMX REST; include references to ensure codelists/dimensions
    dsd: https://unstats.un.org/SDGAPI/v1/sdmx/rest/datastructure/UNSD/SDG_GLOBAL/1.0?references=all
    # Pull NATIONAL series only (avoids mixing in global/regional series)
    # dimension_query:
    #   REPORTING_TYPE: N
    # If you want to limit to most recent values only, you can also add:
    # time_agg: latest

  # Pull global metadata blocks (title, target, etc.)
  - class: InputSdmxMeta
    meta_suffix: __GLOBAL

# --- Translations (standard setup) ---
translations:
  - class: TranslationInputSdgTranslations
    source: https://github.com/open-sdg/sdg-translations.git
    tag: 2.1.0
  - class: TranslationInputYaml
    source: translations

# --- Frictionless/validation tuning ---
# Keeps "Value" numeric while tolerating commas and % signs if present in API payloads.
datapackage:
  package_properties:
    missingValues: ['', '..', 'NA', 'N/A', '-']
  field_properties:
    Value:
      type: number
      bare_number: false   # allow decorations; parser strips them using the rules below
      decimal_char: '.'
      group_char: ','

# --- Docs page for the data build (optional but handy) ---
docs_branding: SDG data build documentation
docs_intro: >
  This is a list of examples of endpoints and output available on this service.
  Click each link for more information.
docs_subfolder: data-docs
# docs_indicator_url: https://your-org/your-site-repo/[id]
